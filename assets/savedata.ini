# ---------------------------------------------------------------------------
# Plants vs. Zombies - save data location
#
# This file ships with the game and decides where progress and profiles are
# stored. Saves always live in a "userdata" subfolder of the location chosen
# here, so this only selects the root folder.
#
# Edit this file in assets\ before building (the build copies it next to the
# executable), or edit the copy that sits next to the executable for a build
# you are not going to rebuild.
#
# mode:
#
#   user      %APPDATA%\<Company>\<Product>
#             Per-user, roams with the Windows profile. Default and the
#             fallback for any unknown or missing value.
#
#   portable  The folder containing the executable.
#             Self-contained: everything travels with the game folder.
#
#   instance  The folder the game process was launched from.
#             One independent save set per launch directory, which is what a
#             launcher or several shortcuts with different "Start in" folders
#             would use.
#
#   static    The path given by "path" below.
#             Absolute, or relative to the executable's own folder.
#
#   legacy    %PROGRAMDATA%\<Company>\<Product>
#             The original shared, machine-wide location. Kept for
#             compatibility with existing installations.
#
# ---------------------------------------------------------------------------

mode = user

# Only used when mode = static. Example:
#   path = D:\PvZSaves
#path =
